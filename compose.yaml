services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mica
      POSTGRES_USER: mica
      POSTGRES_PASSWORD: mica
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mica -d mica"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - mica-postgres:/var/lib/postgresql/data

volumes:
  mica-postgres:
