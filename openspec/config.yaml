schema: spec-driven

context: |
  Project: mica — 最小可用、可教学的 multiCa。
  形态: claw0 式渐进教学仓库。每章一个可直接运行的 Python 单文件 + 同名 .md,
  每章只引入一个新概念,前一章代码原样保留。约 10 章 + 1 可选附录。
  语言: Python(单文件章节,贴 claw0)。
  主题: 把 coding agent 变成数字队友 —— issue 板 → 派给 agent → 本地 daemon 认领 →
  spawn 真实 CLI(`claude` headless)执行 → 实时回传 → 落盘 → 上看板。
  持久化: JSONL + 内存(不引 PostgreSQL)。
  依赖: websockets, croniter, fastapi, uvicorn, httpx, python-dotenv。
  不用 Anthropic SDK 当 agent 执行器;模型连接交给被 spawn 的真实 CLI。

rules:
  proposal:
    - 保留 Why / What Changes / Capabilities / Impact 四段
    - Non-goals 单列在 design.md
  tasks:
    - 按章节(s01..s10,可选 s11)分节
    - 每条任务可独立勾选,粒度 ≤ 2 小时
  spec:
    - 每个 Requirement 配 ≥ 1 个 Scenario,用 WHEN/THEN
    - 用 SHALL / SHALL NOT 关键字
