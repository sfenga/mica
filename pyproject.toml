[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mica"
version = "0.5.0"
description = "A multi-agent task control plane for local and remote enterprise agents."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "mica contributors" }
]
dependencies = [
  "python-dotenv>=1.0.0",
  "websockets>=12.0",
  "croniter>=2.0.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27.0",
  "psycopg[binary]>=3.2.0",
  "jsonschema>=4.23.0",
  "lark-oapi>=1.7.3,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.9,<1",
]

[project.scripts]
mica = "mica.main:main"
mica-daemon = "mica.daemon_main:main"

[tool.setuptools.packages.find]
include = ["mica*"]

[tool.setuptools.package-data]
"mica.infrastructure.database" = ["sql/*.sql"]
"mica.web" = ["*.html", "*.css", "*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
