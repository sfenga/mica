[project]
name = "mica-learning"
version = "0.1.0"
description = "A local-first teaching repo for building a minimal multi-agent coding control plane."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "mica contributors" }
]
dependencies = [
  "python-dotenv>=1.0.0",
  "websockets>=12.0",
  "croniter>=2.0.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
