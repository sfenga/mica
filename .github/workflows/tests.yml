name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mica_test
          POSTGRES_USER: mica
          POSTGRES_PASSWORD: mica
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mica -d mica_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      MICA_TEST_DATABASE_URL: postgresql://mica:mica@127.0.0.1:5432/mica_test
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q mica tests
      - name: Lint
        run: |
          ruff check mica
          ruff format --check mica
      - name: Test
        run: python -m pytest -q
